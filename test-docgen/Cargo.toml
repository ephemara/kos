[package]
name = "k-os-test-module"
version = "0.1.0"
edition = "2021"
description = "Test module for DocGen system verification"
authors = ["K_OS Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
proptest = "1.0"

[[bin]]
name = "test-processor"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = []
cpu-only = []