# KAIN Omni Manifest - Shader Builder
# One source emits shader/runtime artifacts for suite integration.

[project]
entry = "shader_builder.kn"
build_dir = "dist"

[import_resolution]
inline_kain_imports = true
search_roots = []

[[targets]]
kind = "spirv"
output = "dist/shader_builder.spv"

[[targets]]
kind = "rust_bundle"
output = "dist/shader_builder_bundle"
artifacts = ["source", "shader_host", "shader_reflection", "spirv"]

[[targets]]
kind = "ts"
output = "dist/ShaderBuilderBindings.ts"

[[targets]]
kind = "ks"
output = "dist/shader_builder.ks"
