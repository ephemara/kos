# Example: Crosshair Cursor
# Demonstrates: Cursor generation with hotspot metadata

name: "Crosshair Cursor"
description: "Precision crosshair cursor for 3D viewport"
generator_type: "cursor"
category: "viewport"
tags: ["cursor", "crosshair", "precision"]

output_formats:
  - "png"

dimensions:
  width: 32
  height: 32

params:
  cursor_type: "crosshair"
  line_width: 2
  line_color: "#ffffff"
  outline_color: "#000000"
  outline_width: 1
  center_dot: true
  dot_size: 2
  hotspot_x: 16
  hotspot_y: 16

version: "1.0"
