name: "Holographic Prism - Insane"
description: "Complex prismatic effect with angular gradients"
generator_type: "icon"
category: "showcase"
tags: ["insane", "holographic", "prism"]

output_formats: ["png", "svg"]
dimensions:
  width: 128
  height: 128

colors: ["#ff0080", "#00ffff", "#ffff00", "#8000ff"]

params:
  padding: 8
  antialias_factor: 3
  layers:
    # Background radial burst
    - type: "circle"
      geometry:
        cx: 64
        cy: 64
        r: 60
      fill:
        type: "angular_gradient"
        colors: ["#ff0080", "#ffff00", "#00ffff", "#8000ff", "#ff0080"]
        stops: [0.0, 0.25, 0.5, 0.75, 1.0]
        angle: 0
      opacity: 0.4
      blend_mode: "screen"
    
    # Main prism (hexagon approximation with polygons)
    - type: "polygon"
      geometry:
        points: [[64, 20], [95, 40], [95, 88], [64, 108], [33, 88], [33, 40]]
      fill:
        type: "linear_gradient"
        colors: ["#ff0080", "#00ffff"]
        angle: 45
      opacity: 0.8
    
    # Inner prism facets
    - type: "polygon"
      geometry:
        points: [[64, 35], [80, 50], [64, 64]]
      fill:
        type: "solid"
        colors: ["#ffff00"]
      opacity: 0.6
      blend_mode: "overlay"
    
    - type: "polygon"
      geometry:
        points: [[64, 64], [80, 78], [64, 93]]
      fill:
        type: "solid"
        colors: ["#00ffff"]
      opacity: 0.6
      blend_mode: "overlay"
    
    - type: "polygon"
      geometry:
        points: [[64, 64], [48, 78], [64, 93]]
      fill:
        type: "solid"
        colors: ["#8000ff"]
      opacity: 0.6
      blend_mode: "overlay"
    
    - type: "polygon"
      geometry:
        points: [[64, 35], [48, 50], [64, 64]]
      fill:
        type: "solid"
        colors: ["#ff0080"]
      opacity: 0.6
      blend_mode: "overlay"
    
    # Center glow
    - type: "circle"
      geometry:
        cx: 64
        cy: 64
        r: 12
      fill:
        type: "radial_gradient"
        colors: ["#ffffff", "#ff0080", "#00000000"]
        stops: [0.0, 0.5, 1.0]
      opacity: 1.0
      blend_mode: "screen"
    
    # Light rays (thin rectangles)
    - type: "rect"
      geometry:
        x: 62
        y: 10
        width: 4
        height: 25
      fill:
        type: "linear_gradient"
        colors: ["#ffffff", "#00000000"]
        stops: [0.0, 1.0]
        angle: 90
      opacity: 0.7
      blend_mode: "screen"
    
    - type: "rect"
      geometry:
        x: 62
        y: 93
        width: 4
        height: 25
      fill:
        type: "linear_gradient"
        colors: ["#00000000", "#ffffff"]
        stops: [0.0, 1.0]
        angle: 90
      opacity: 0.7
      blend_mode: "screen"

animation:
  enabled: true
  motion_types: ["float", "orbit"]
  duration: 4.0
  fps: 30
  loop: true
  easing: "ease-in-out"
  output_type: "svg_smil"
  motion_params:
    float:
      amplitude: 0.1
      frequency: 2
    orbit:
      radius: 0
      speed: 0.5
