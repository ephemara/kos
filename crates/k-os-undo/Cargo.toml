[package]
name = "k-os-undo"
version = "0.1.0"
edition = "2021"
description = "K_OS Universal Undo/Redo System - Memory-aware undo/redo management with action merging and compression"

[lib]
name = "k_os_undo"
path = "src/lib.rs"

[dependencies]
# === ERROR HANDLING ===
thiserror = "2.0"

# === SERIALIZATION (for compression) ===
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# === COMPRESSION ===
flate2 = "1.0"

# === CONCURRENCY ===
parking_lot = "0.12"

# === LOGGING ===
log = "0.4"

[dev-dependencies]
# === TESTING ===
proptest = "1.5"
env_logger = "0.11"
