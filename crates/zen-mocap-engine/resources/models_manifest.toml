# ─── RTMw3D Whole-body 3D Pose ────────────────────────────────────────────────
# 133 keypoints in 3D camera space (body 0-16, feet 17-22, face 23-90,
# left hand 91-111, right hand 112-132). Directly drives 3D skeleton retarget.
# Input must be a cropped person region (use yolov11n as detector first stage).

[[models]]
id = "rtmw3d_l"
name = "RTMw3D-l · Whole-body 3D"
url = ""
sha256 = ""
filename = "rtmw3d_l_384x288.onnx"
input_shape = [1, 3, 384, 288]
keypoints = 133
precision = "fp32"
preprocess = "imagenet"
description = "133 whole-body keypoints in 3D. Drives fingers, face, full body. 8GB+ VRAM."

