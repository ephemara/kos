# ZenMocap Model Manifest
#
# Data-driven model registry — ALL models ship bundled with the app.
# Drop converted .onnx files into src-tauri/resources/models/ and rebuild.
# Run convert_models.py to generate ONNX from .pt/.pth checkpoints.
#
# Fields:
#   id           - Internal key used by session config
#   name         - Display name in the UI
#   url          - Fallback download URL (empty = bundled only)
#   sha256       - Hex SHA-256 for verification (empty = skip)
#   filename     - Exact .onnx filename in resources/models/
#   input_shape  - NCHW [batch, channels, height, width]
#   keypoints    - Keypoint count (17 = COCO body, 133 = whole-body)
#   precision    - "fp32" | "fp16"
#   description  - Shown in the model selector UI

# ─── YOLO11 Pose (single-pass detection + 2D pose) ────────────────────────────
# One-shot: detects people AND estimates 17-keypoint COCO pose simultaneously.
# Best for live capture — no separate detector needed.

[[models]]
id = "yolov11n_pose"
name = "YOLO11-n · Nano"
url = ""
sha256 = ""
filename = "yolov11n_pose.onnx"
input_shape = [1, 3, 640, 640]
keypoints = 17
precision = "fp32"
preprocess = "zero_to_one"
description = "Fastest. Great for CPU or weak GPU. ~3M params."

