[package]
name = "k-os-config"
version = "0.1.0"
edition = "2021"
description = "K_OS configuration domain owner"

[lib]
name = "k_os_config"
path = "src/lib.rs"

[features]
default = ["tauri-commands"]
tauri-commands = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }
dirs = "6.0.0"
jsonschema = "0.26"
log = "0.4"
notify = "7.0"
once_cell = "1.21"
parking_lot = "0.12"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
