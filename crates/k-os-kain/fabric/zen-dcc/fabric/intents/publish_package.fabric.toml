version = 1

[workspace]
root = "."
search_roots = ["src", "scripts", "shaders", "local_crate"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_seed"
runtime = "python"
entry = "scripts/python_seed.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "zen_dcc_seed"
runtime = "kain"
entry = "src/seed.kn"
depends_on = ["python_seed"]

[[steps.outputs]]
name = "scene_graph_document"
kind = "value"

[[steps.outputs]]
name = "preview_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "tensor_features"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_session_report"
kind = "value"

[[steps]]
id = "topology_analyzer"
runtime = "rust_crate"
entry = "src/rust_topology_step.kn"
crate_name = "zen_dcc_fabric_runtime"
manifest_path = "local_crate/Cargo.toml"
depends_on = ["zen_dcc_seed"]

[[steps.outputs]]
name = "topology_report"
kind = "value"

[[steps]]
id = "gpu_material_preview"
runtime = "gpu_compute"
shader_source = "shaders/material_bake_preview.kn"
compute_key = "ZenDccMaterialBakePreview"
depends_on = ["zen_dcc_seed"]

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps]]
id = "node_publish_package"
runtime = "node"
entry = "scripts/node_publish_package.mjs"
depends_on = ["zen_dcc_seed", "topology_analyzer", "gpu_material_preview"]

[[steps.outputs]]
name = "publish_summary"
kind = "value"

[reports]
directory = ".kain/fabric/intents/publish_package"
emit_jsonl_events = true
