[package]
name = "k-os-scene-runtime"
version = "0.1.0"
edition = "2021"
description = "K_OS scene runtime ownership for shared mesh state and viewport bridge data"

[lib]
name = "k_os_scene_runtime"
path = "src/lib.rs"

[dependencies]
k-os-scene = { path = "../k-os-scene" }
k-os-eval = { path = "../k-os-eval" }
k-os-gpu-pipeline = { path = "../k-os-gpu-pipeline" }
k-os-animation = { path = "../k-os-animation" }
lazy_static = "1.4"
log = "0.4"
parry3d = "0.17"
serde = { version = "1.0", features = ["derive"] }
