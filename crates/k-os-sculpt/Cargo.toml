[package]
name = "k-os-sculpt"
version = "0.1.0"
edition = "2021"
description = "K_OS sculpting domain crate - ownership boundary for brushes, masking, and sculpt workflows"

[lib]
name = "k_os_sculpt"
path = "src/lib.rs"

[features]
default = []
physics = []

[dependencies]
k-os-brushes = { path = "../k-os-brushes" }
k-os-eval = { path = "../k-os-eval" }
k-os-gpu-pipeline = { path = "../k-os-gpu-pipeline" }
k-os-scene = { path = "../k-os-scene" }
k-os-scene-runtime = { path = "../k-os-scene-runtime" }
k-os-sim = { path = "../k-os-sim" }
bytemuck = { version = "1.20", features = ["derive"] }
fixedbitset = "0.5"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
kiddo = "4.2"
lazy_static = "1.4"
log = "0.4"
mikktspace = "0.2"
once_cell = "1.21"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
tauri = "2"
wgpu = "26"
