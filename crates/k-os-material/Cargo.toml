[package]
name = "k-os-material"
version = "0.1.0"
edition = "2021"
description = "K_OS Material System - PBR materials with texture management, presets, and serialization"

[lib]
name = "k_os_material"
path = "src/lib.rs"

[dependencies]
k-os-gpu-pipeline = { path = "../k-os-gpu-pipeline" }
# === ERROR HANDLING ===
anyhow = "1.0"
thiserror = "2.0"

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# === UUID GENERATION ===
uuid = { version = "1.11", features = ["v4", "serde"] }

# === MATH ===
glam = { version = "0.30", features = ["serde", "bytemuck"] }

# === CONCURRENCY ===
parking_lot = "0.12"
lazy_static = "1.4"
once_cell = "1.21"

# === LOGGING ===
log = "0.4"
base64 = "0.22"
bytemuck = { version = "1.20", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
evalexpr = "12.0"
fastrand = "2.0"
gltf = { version = "1.4", features = ["utils"] }
gltf-json = "1.4"
image = "0.25"
jsonschema = "0.26"
noise = "0.9"
notify = "7.0"
pollster = "0.4.0"
rayon = "1.10"
sublime_fuzzy = "0.7"
wgpu = "26"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# === VALIDATION ===
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
# === TESTING ===
proptest = "1.5"
env_logger = "0.11"
tempfile = "3.13"
