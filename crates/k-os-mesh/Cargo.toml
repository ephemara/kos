[package]
name = "k-os-mesh"
version = "0.1.0"
edition = "2021"
description = "K_OS mesh domain compatibility surface"

[lib]
name = "k_os_mesh"
path = "src/lib.rs"

[features]
default = []
atlas = ["dep:xatlas"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
meshopt = "0.3"
bytemuck = { version = "1.20", features = ["derive"] }
xatlas = { package = "xatlas-rs", version = "0.1", optional = true }
