[package]
name = "k-os-mesh-processing"
version = "0.1.0"
edition = "2021"
description = "K_OS Mesh Processing - Advanced mesh operations including decimation, smoothing, subdivision, repair, analysis, and UV unwrapping"

[lib]
name = "k_os_mesh_processing"
path = "src/lib.rs"

[dependencies]
# === ERROR HANDLING ===
thiserror = "2.0"

# === MATH ===
glam = { version = "0.30", features = ["serde"] }
nalgebra = "0.33"

# === MESH OPTIMIZATION ===
meshopt = "0.3"

# === SPATIAL STRUCTURES ===
kiddo = "4.2"

# === GEOMETRY ===
parry3d = { version = "0.17", features = ["serde-serialize"] }

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }

# === LOGGING ===
log = "0.4"

# === CONCURRENCY ===
rayon = "1.10"

[dev-dependencies]
# === TESTING ===
proptest = "1.5"
env_logger = "0.11"
criterion = "0.5"

[[bench]]
name = "mesh_processing_bench"
harness = false
