[package]
name = "k-os-rig"
version = "0.1.0"
edition = "2021"
description = "K_OS rigging domain compatibility surface"

[lib]
name = "k_os_rig"
path = "src/lib.rs"

[dependencies]
glam = { version = "0.30", features = ["serde"] }
kiddo = "4.2"
log = "0.4"
ndarray = "0.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
