[package]
name = "k-os-scatter"
version = "0.1.0"
edition = "2021"
description = "K_OS scatter domain"

[lib]
name = "k_os_scatter"
path = "src/lib.rs"

[features]
default = ["physics"]
physics = ["dep:rapier3d"]

[dependencies]
tauri = { version = "2" }
kiddo = "4.2"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
log = "0.4"
fastrand = "2.0"
voronoice = "0.2"
noise = "0.9"
nalgebra = "0.33"
rapier3d = { version = "0.22", features = ["simd-stable", "parallel"], optional = true }
