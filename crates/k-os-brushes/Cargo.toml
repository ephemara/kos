[package]
name = "k-os-brushes"
version = "0.1.0"
edition = "2021"
description = "K_OS brush asset and kernel ownership boundary"

[lib]
name = "k_os_brushes"
path = "src/lib.rs"

[dependencies]
k-os-gpu-pipeline = { path = "../k-os-gpu-pipeline" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.33"
uuid = { version = "1.19.0", features = ["v4", "js", "serde"] }
bytemuck = { version = "1.20", features = ["derive"] }
rand = "0.8"
once_cell = "1.21"
parking_lot = "0.12"
glob = "0.3.3"
log = "0.4"
tauri = { version = "2" }
