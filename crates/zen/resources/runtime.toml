[window]
title = "Zen // Native Renderer MVP"
width = 1540
height = 920
min_width = 960
min_height = 600

[camera]
start_position = [0.0, 3.0, 10.0]
yaw = -1.5707964
pitch = -0.18
fov_degrees = 60.0
near_plane = 0.1
far_plane = 500.0

[kain]
validate_catalog_on_startup = true
enable_dispatch = false
dispatch_interval_frames = 12

[kain.ui]
enabled = true
modules_manifest_path = "crates/zen/resources/modules.toml"
workspace_manifest_path = "crates/zen/resources/workspace_ui.toml"
theme_manifest_path = "crates/zen/resources/theme.toml"
hot_reload_enabled = true
hot_reload_poll_ms = 400
active_shell = "zen.shell.main"
host_api_path = "crates/zen/resources/host_api.toml"
root_component = "App"
show_runtime_inspector = false

[kain.fabric]
enabled = true
manifest_path = "crates/k-os-kain/fabric/zen-dcc/KAIN.fabric.toml"

[renderer]
shadow_map_size = 2048
shadow_strength = 0.84
shadow_softness = 1.35
ambient_strength = 0.24
fog_density = 0.028
rim_strength = 0.22
grid_intensity = 0.86
sun_direction = [0.42, -1.0, 0.28]
sun_color = [1.0, 0.93, 0.82, 1.0]
light_distance = 22.0
light_projection_radius = 24.0
light_near = 0.1
light_far = 72.0

[renderer.post]
enabled = false
compile_on_startup = false
shader_id = "renderer_zen_atmosphere"
shader_source_path = "crates/k-os-kain/domains/renderer/renderer_zen_atmosphere.kn"
shader_compiled_path = "crates/k-os-kain/generated/spv/renderer/renderer_zen_atmosphere.spv"
glow_strength = 1.15
haze_strength = 0.9
sun_disk_power = 42.0
sky_top = [0.05, 0.11, 0.28, 1.0]
sky_horizon = [0.92, 0.48, 0.22, 1.0]
ground_color = [0.04, 0.05, 0.08, 1.0]
fog_color = [0.17, 0.29, 0.36, 1.0]
shadow_color = [0.04, 0.07, 0.12, 1.0]
