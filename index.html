  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K-OS Unified Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* K_OS Theme System - CSS Custom Properties */
      :root {
        /* Default theme (Classic) - overridden by ThemeProvider */
        --kos-surface-primary: rgba(8, 8, 8, 1);
        --kos-surface-secondary: rgba(11, 11, 11, 1);
        --kos-surface-tertiary: rgba(17, 17, 17, 1);
        --kos-surface-overlay: rgba(5, 5, 5, 0.95);
        --kos-surface-hover: rgba(26, 26, 26, 1);
        --kos-surface-active: rgba(22, 22, 22, 1);

        --kos-border-primary: rgba(34, 34, 34, 1);
        --kos-border-secondary: rgba(51, 51, 51, 1);
        --kos-border-accent: rgba(0, 255, 204, 0.3);
        --kos-border-hover: rgba(74, 74, 74, 1);

        --kos-text-primary: rgba(255, 255, 255, 0.95);
        --kos-text-secondary: rgba(200, 200, 200, 0.9);
        --kos-text-muted: rgba(128, 128, 128, 1);
        --kos-text-accent: rgba(0, 255, 204, 1);
        --kos-text-inverse: rgba(0, 0, 0, 0.9);

        --kos-accent-primary: rgba(0, 255, 204, 1);
        --kos-accent-secondary: rgba(34, 211, 238, 1);
        --kos-accent-glow: rgba(0, 255, 204, 0.15);
        --kos-accent-muted: rgba(0, 255, 204, 0.5);

        --kos-success: rgba(34, 197, 94, 1);
        --kos-warning: rgba(234, 179, 8, 1);
        --kos-error: rgba(239, 68, 68, 1);
        --kos-info: rgba(59, 130, 246, 1);

        --kos-blur: 0px;
        --kos-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
        --kos-shadow-md: 0 4px 8px rgba(0, 0, 0, 0.5);
        --kos-shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.6);
        --kos-shadow-glow: 0 0 20px rgba(0, 255, 204, 0.15);

        --kos-radius-sm: 4px;
        --kos-radius-md: 6px;
        --kos-radius-lg: 8px;
        --kos-radius-full: 9999px;

        --kos-transition-fast: 100ms;
        --kos-transition-base: 200ms;
        --kos-transition-slow: 300ms;
      }

      body {
        font-family: 'Inter', 'Segoe UI', 'SF Pro Text', Roboto, Helvetica, Arial, system-ui, sans-serif;
        background-color: var(--kos-surface-primary);
        color: var(--kos-text-primary);
        overflow: hidden;
      }

      /* Theme-aware scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--kos-surface-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--kos-accent-primary);
        border-radius: var(--kos-radius-sm);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--kos-text-primary);
      }

      /* Glass effect utility */
      .kos-glass {
        backdrop-filter: blur(var(--kos-blur));
        -webkit-backdrop-filter: blur(var(--kos-blur));
      }

      /* Glow effect utility */
      .kos-glow {
        box-shadow: var(--kos-shadow-glow);
      }

      /* Theme transition for smooth switching */
      .kos-theme-transition {
        transition: 
          background-color var(--kos-transition-base) ease,
          border-color var(--kos-transition-base) ease,
          color var(--kos-transition-base) ease,
          box-shadow var(--kos-transition-base) ease;
      }
    </style>
