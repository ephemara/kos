[package]
name = "k-os-kain"
version = "0.1.0"
edition = "2021"
description = "K_OS KAIN source registry and domain metadata"

[lib]
name = "k_os_kain"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
once_cell = "1.21"
naga = { version = "26", features = ["spv-in"] }

[build-dependencies]
serde_json = "1.0"
