<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>UI Forge - 10 Icon Showcase</title>
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);font-family:sans-serif;padding:40px;margin:0}
h1{color:#fff;text-align:center;font-size:3em;margin-bottom:50px;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:transform 0.3s}
.card:hover{transform:translateY(-10px) scale(1.05)}
.icon{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f0f0f0 0% 25%,transparent 0% 50%) 50%/20px 20px;border-radius:10px;margin-bottom:15px}
.icon img{max-width:128px;max-height:128px}
.title{font-size:1.1em;font-weight:bold;color:#333;text-align:center}
</style></head><body>
<h1>🎨 UI Forge Showcase</h1>
<div class="gallery">
<div class="card"><div class="icon"><img src="output\showcase\blue-circle.png"></div><div class="title">Blue Circle</div></div><div class="card"><div class="icon"><img src="output\showcase\red-square.png"></div><div class="title">Red Square</div></div><div class="card"><div class="icon"><img src="output\showcase\green-triangle.png"></div><div class="title">Green Triangle</div></div><div class="card"><div class="icon"><img src="output\showcase\purple-gradient.png"></div><div class="title">Purple Gradient</div></div><div class="card"><div class="icon"><img src="output\showcase\orange-star.png"></div><div class="title">Orange Star</div></div><div class="card"><div class="icon"><img src="output\showcase\cyan-diamond.png"></div><div class="title">Cyan Diamond</div></div><div class="card"><div class="icon"><img src="output\showcase\pink-heart.png"></div><div class="title">Pink Heart</div></div><div class="card"><div class="icon"><img src="output\showcase\yellow-sun.png"></div><div class="title">Yellow Sun</div></div><div class="card"><div class="icon"><img src="output\showcase\teal-hexagon.png"></div><div class="title">Teal Hexagon</div></div><div class="card"><div class="icon"><img src="output\showcase\rainbow-layers.png"></div><div class="title">Rainbow Layers</div></div></div></body></html>
