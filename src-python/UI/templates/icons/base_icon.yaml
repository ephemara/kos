# Base Icon Template
# Provides common defaults for all icon templates

name: "Base Icon Template"
description: "Base template with common icon defaults"
generator_type: "icon"
category: "base"
tags: []

# Output configuration
output_formats:
  - "png"
  - "svg"

dimensions:
  width: 64
  height: 64

aspect_ratio: "fixed"

# Quality settings
png_compression: 6
jpeg_quality: 95

# Visual defaults
alpha_mode: "embedded"

# Icon-specific parameters
params:
  padding: 8
  antialias_factor: 2
  background: null

version: "1.0"
